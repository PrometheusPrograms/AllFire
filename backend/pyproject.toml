[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
# Autogenerated by `alembic revision --autogenerate` — not hand-maintained, not linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
